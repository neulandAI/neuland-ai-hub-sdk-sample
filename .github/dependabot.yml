version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly

    - package-ecosystem: pip
      directory: /python/sdk
      schedule:
          interval: weekly

    - package-ecosystem: pip
      directory: /python/sample-app
      schedule:
          interval: weekly

    # axios bumps may break the generated SDK (see MAINTAINING.md); CI's
    # build-node-sdk job fails the PR if so.
    - package-ecosystem: npm
      directory: /nodejs/sdk
      schedule:
          interval: weekly

    - package-ecosystem: npm
      directory: /nodejs/sample-app
      schedule:
          interval: weekly
