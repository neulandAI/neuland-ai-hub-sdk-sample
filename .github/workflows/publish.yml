name: Release SDK

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Version type (patch, minor, major)"
                required: true
                default: "patch"
                type: choice
                options:
                    - patch
                    - minor
                    - major

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Bump version
              id: bump
              working-directory: python/sdk
              run: |
                  CURRENT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
                  IFS='.' read -r MAJ MIN PATCH <<< "$CURRENT"
                  case "${{ github.event.inputs.version }}" in
                      patch) PATCH=$((PATCH+1)) ;;
                      minor) MIN=$((MIN+1)); PATCH=0 ;;
                      major) MAJ=$((MAJ+1)); MIN=0; PATCH=0 ;;
                  esac
                  NEW="$MAJ.$MIN.$PATCH"
                  sed -i "s/^version = \".*\"/version = \"$NEW\"/" pyproject.toml
                  sed -i "s/^VERSION = \".*\"/VERSION = \"$NEW\"/" setup.py
                  sed -i "s/^__version__ = \".*\"/__version__ = \"$NEW\"/" neuland_hub_sdk/__init__.py
                  sed -i "s|OpenAPI-Generator/[0-9][0-9.]*\/python|OpenAPI-Generator/$NEW/python|" neuland_hub_sdk/api_client.py
                  sed -i "s|SDK Package Version: [0-9][0-9.]*|SDK Package Version: $NEW|" neuland_hub_sdk/configuration.py
                  echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

            - name: Commit, tag, push
              run: |
                  git config user.name "GitHub Actions"
                  git config user.email "actions@github.com"
                  git add  python/sdk/pyproject.toml \
                          python/sdk/setup.py \
                          python/sdk/neuland_hub_sdk/__init__.py \
                          python/sdk/neuland_hub_sdk/api_client.py \
                          python/sdk/neuland_hub_sdk/configuration.py
                  git commit --no-gpg-sign -m "Release SDK v${{ steps.bump.outputs.new_version }}"
                  git tag "sdk-v${{ steps.bump.outputs.new_version }}"
                  git push && git push --tags
