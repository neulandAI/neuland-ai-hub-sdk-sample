name: CI

on:
    push:
        branches: [dev]
    pull_request:
        branches: [dev]

jobs:
    build-sdk:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: sample-app/sdk

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: "pip"

            - name: Install build tools
              run: |
                  python -m pip install --upgrade pip
                  pip install build

            - name: Build sdist and wheel
              run: python -m build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: sdk-dist
                  path: sample-app/sdk/dist/
